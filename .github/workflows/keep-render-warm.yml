name: Keep Render backend warm

# Render's free tier spins the web service down after ~15 minutes of no traffic;
# the next request then pays a 30-90s cold start (Docker boot + migrations +
# admin provisioning + server start). Pinging /healthz well inside that window
# keeps it warm so real users never hit a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          curl -sS -o /dev/null -w "healthz responded HTTP %{http_code} in %{time_total}s\n" \
            --max-time 100 \
            https://talentsift-api.onrender.com/healthz
