services:
  - type: web
    name: talentsift-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: MISTRAL_API_KEYS
        sync: false
      - key: MISTRAL_BASE_URL
        value: https://api.mistral.ai/v1
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: EMBEDDING_PROVIDER
        value: nvidia
      - key: EMBEDDING_MODEL_NAME
        value: nvidia/nemotron-3.5-embed-1b
      - key: EMBEDDING_DIMENSIONS
        value: "1024"
      - key: PRODUCT_KEY_PEPPER
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
